name: Deploy to VPS
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git' --exclude='tests' --exclude='prepare_publish.py' --exclude='publish_config.json' --exclude='.publish-gui.log*'
          path: ./
          remote_path: /var/www/ctf_writeups/
          remote_host: ${{ vars.VPS_HOST }}
          remote_user: ${{ vars.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
